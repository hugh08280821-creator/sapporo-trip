<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>삿포로 기념일 여행</title>
<meta name="description" content="결혼기념일 삿포로 2박 3일 여행 가이드 — 일정, 맛집, 명소, 실시간 길찾기">
<meta name="theme-color" content="#14213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="삿포로 여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 id="page-title">삿포로 2박 3일</h1>
    <div class="top-actions">
      <button class="sos-btn" id="sos-btn" type="button" aria-label="긴급 도움: 전화와 내 위치 보내기">SOS</button>
      <button class="loc-pill" id="loc-pill" type="button" aria-live="polite">
        <span class="dot"></span><span class="loc-text">내 위치 켜기</span>
      </button>
    </div>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<div class="map-wrap" id="map-wrap" hidden>
  <div id="map"></div>
  <div class="map-chips" id="map-chips"></div>
  <div class="map-actions">
    <button type="button" class="fab" data-send-loc aria-label="내 위치 보내기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg></button>
    <button type="button" class="fab" id="btn-locate" aria-label="내 위치로 이동"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" class="fill"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
</div>

<nav class="tabbar" aria-label="메뉴">
  <a href="#/plan" data-tab="plan"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h3M8 17h6"/></svg>내 일정</a>
  <a href="#/map" data-tab="map"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4Z"/><path d="M9 4v14M15 6v14"/></svg>지도</a>
  <a href="#/places" data-tab="places"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8 4.8-2.2Z"/></svg>둘러보기</a>
  <a href="#/diary" data-tab="diary"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="18" height="13.5" rx="2.5"/><path d="M8.5 6.5 10 4h4l1.5 2.5"/><circle cx="12" cy="13.2" r="3.6"/></svg>앨범</a>
  <a href="#/info" data-tab="info"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M4 12.5h16"/></svg>정보</a>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <button type="button" class="sheet-close" id="sheet-close" aria-label="닫기">✕</button>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<div class="showcard" id="showcard" hidden>
  <div class="showcard-inner" id="showcard-inner"></div>
  <button type="button" class="showcard-close" id="showcard-close">닫기</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="extra.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
<script src="diary.js"></script>
</body>
</html>
